marketplace:
  owner:
    name: "Dylan J. Gerrits"
    url: https://github.com/Dyrits
  outputs:
    claude: {}
  claude:
    output: marketplace.json
  packages:
    - name: design-workflow
      source: ./skills/productivity/design-workflow
      description: "Interview the user into implementable workflow specifications for recurring loops in their work, using the current directory as a stateful workspace."
    - name: hand-off
      source: ./skills/productivity/hand-off
      description: "Write the current session's work into a versioned, self-contained handoff document in .agents/handoffs/ and point to it from AGENTS.md, so another session, agent, or person can resume it."
    - name: illustrate
      source: ./skills/productivity/illustrate
      description: "Explain the current topic visually."
    - name: memorize
      source: ./skills/productivity/memorize
      description: "File a lesson in the home the next agent will read, and recall saved scripts and lessons before redoing work."
    - name: optimize-process
      source: ./skills/productivity/optimize-process
      description: "Analyze and improve a recurring work process when the user reports delays, excessive steps, rework, or handoff friction."
    - name: publish-message
      source: ./skills/productivity/publish-message
      description: "Publish an established conclusion or review summary to a connected service (code host, tracker, chat, documentation, email) in its conventions."
    - name: re-explain
      source: ./skills/productivity/re-explain
      description: "Re-explain what did not land, with the missing context and familiar vocabulary."
    - name: swarm
      source: ./skills/productivity/swarm
      description: "Divide one task into independent pieces and run them in parallel on fast, low-cost subagents the user selects, then merge and spot-check their reports."
    - name: teach
      source: ./skills/productivity/teach
      description: "Teach the user a skill or concept over multiple sessions in a stateful workspace."
    - name: unslop
      source: ./skills/productivity/unslop
      description: "Cut AI tells from prose that other people will read, in any language."
    - name: walk-through
      source: ./skills/productivity/walk-through
      description: "Generate an interactive bash wizard that walks a human through steps only they can perform."
    - name: write-for-agents
      source: ./skills/productivity/write-for-agents
      description: "Write documents for agents: skills, AGENTS.md, and documents reached by a pointer."
    - name: setup
      source: ./skills/setup/setup
      description: "Set up a repository, or an empty project, for AI-assisted work: task tracking and triage roles, commit-time formatting, linting and typechecking, guards that make agents ask before destructive Git commands, and AI development tools."
    - name: setup-delegation-policy
      source: ./skills/setup/setup-delegation-policy
      description: "Install, reconfigure, or remove the delegation and model routing rule, and the tier agents it needs, for each agent harness on this machine."
    - name: graphify
      source: ./skills/shaping/graphify
      description: "Build and work through a shared decision graph for an effort too large for one session."
    - name: interview
      source: ./skills/shaping/interview
      description: "Interview the user in rounds of questions, each with a recommended answer, until a plan, decision, or idea is settled."
    - name: prioritize
      source: ./skills/shaping/prioritize
      description: "Decompose a large or tangled idea into outcomes, recommend one focus to build next, and keep the rest in the backlog."
    - name: prototype
      source: ./skills/shaping/prototype
      description: "Build a scoped experimental prototype to answer a user-requested or approved design question about logic, state, or UI."
    - name: research
      source: ./skills/shaping/research
      description: "Investigate a question against high-trust primary sources and capture the findings as a Markdown file in the repository."
    - name: codify
      source: ./skills/upkeep/codify
      description: "Define the project's code conventions by drafting candidate rules from how the code is already written and confirming each with the user and its reason, or audit an existing conventions file."
    - name: debug
      source: ./skills/upkeep/debug
      description: "Diagnosis loop for hard bugs and performance regressions."
    - name: improve-codebase-architecture
      source: ./skills/upkeep/improve-codebase-architecture
      description: "Scan a codebase for deepening opportunities, present them as a visual HTML report, then interview through the chosen one."
    - name: improve-environment
      source: ./skills/upkeep/improve-environment
      description: "Hold a retrospective on a session's friction, then change the project's environment so the next run avoids it: checks, guardrails, navigation pointers, steering files, tool and information access."
    - name: improve-skills
      source: ./skills/upkeep/improve-skills
      description: "Hold a retrospective on a session, then report how the skills behaved as an issue on the skills repository."
    - name: monitor-ai-tooling
      source: ./skills/upkeep/monitor-ai-tooling
      description: "Report AI tooling usage, measured output reduction, quality signals, and gaps from existing local measurements."
    - name: triage
      source: ./skills/upkeep/triage
      description: "Move tasks and external PRs through triage roles: categorize, verify, refine, and write agent-ready briefs."
    - name: draft-merge-request
      source: ./skills/version-control/draft-merge-request
      description: "Write the body of a pull request or merge request: a summary visual, before/after evidence, and the merge danger."
    - name: rebase
      source: ./skills/version-control/rebase
      description: "Rebase local branches in place onto one target, resolve conflicts, run checks, then push with force-with-lease on approval."
    - name: resolve-merge-conflicts
      source: ./skills/version-control/resolve-merge-conflicts
      description: "Resolve an in-progress git merge or rebase conflict."
    - name: sync-tree
      source: ./skills/version-control/sync-tree
      description: "Sync a completed Git worktree branch to its corresponding branch in the original local repository."
    - name: work-in-tree
      source: ./skills/version-control/work-in-tree
      description: "Create or reuse an isolated Git worktree and carry out the task there, preserving the original checkout."
    - name: address-feedback
      source: ./skills/workflow/address-feedback
      description: "Assess review feedback from any source (pull or merge request, issue, ticket, document comments, pasted notes), propose dispositions, then implement and reply."
    - name: architect
      source: ./skills/workflow/architect
      description: "Decide or assess a system's technical shape (technology stack, parts and their boundaries, data ownership and flows, integrations, deployment) and how it meets the system-wide requirements, weighing alternatives and their tradeoffs."
    - name: delineate
      source: ./skills/workflow/delineate
      description: "Outline a system functionally (its purpose, actors, domain contexts, capability map, system-wide requirements, and glossary), settling fuzzy or conflicting terms along the way."
    - name: divide-and-conquer
      source: ./skills/workflow/divide-and-conquer
      description: "Implement an authorized task graph in parallel: route each task to the least expensive capable agent, build on one integration branch, then review once."
    - name: engineer
      source: ./skills/workflow/engineer
      description: "Design one capability's technical solution before implementation (modules and their interfaces, data model, seams, and where each acceptance test attaches) inside the system's architecture, and write it down without writing production code."
    - name: implement
      source: ./skills/workflow/implement
      description: "Implement authorized work test-first and report its verification evidence."
    - name: iterate
      source: ./skills/workflow/iterate
      description: "Build a living application one verified batch at a time, settling decisions just in time."
    - name: review-and-refactor
      source: ./skills/workflow/review-and-refactor
      description: "Review and refactor changes since a fixed point against repository standards and the originating behavior agreement."
    - name: specify
      source: ./skills/workflow/specify
      description: "Resolve the open decisions about one capability's observable behavior and synthesize its living repository specification: behavior, edge cases, acceptance, and capability requirements."
    - name: taskify
      source: ./skills/workflow/taskify
      description: "Decompose approved work into verifiable tasks with explicit blocking dependencies, locally or on an approved tracker."
    - name: test-first
      source: ./skills/workflow/test-first
      description: "Build features or fix bugs test-first through the red-green loop of test-driven development (TDD), leaving refactoring to a later review."
